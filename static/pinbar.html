<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Pinpoint</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: grid; place-items: center; font: 13px/1.3 Inter, "Noto Sans", system-ui, sans-serif; color: #f2f2f4; }
  .bar {
    display: flex; align-items: center; gap: 4px; padding: 5px 6px 5px 14px; white-space: nowrap;
    background: rgba(30, 30, 33, 0.94); border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 14px;
  }
  span { color: #9a9aa2; margin-right: 6px; }
  button { all: unset; height: 30px; padding: 0 10px; border-radius: 8px; cursor: default; display: grid; place-items: center; }
  button:hover { background: rgba(255, 255, 255, 0.14); }
  button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
</style>
</head>
<body>
  <div class="bar">
    <span>Pinned · clicks go through</span>
    <button data-a="draw">Draw</button>
    <button data-a="clear">Clear</button>
    <button data-a="close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
<script>
  document.querySelector('.bar').addEventListener('click', e => {
    const a = e.target.closest('button')?.dataset.a;
    if (a) pin.pinbar(a);
  });
</script>
</body>
</html>
